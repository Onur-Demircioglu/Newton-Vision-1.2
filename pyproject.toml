[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.12"]
build-backend = "scikit_build_core.build"

[project]
name = "newton-vision"
version = "1.1.6"
description = "High-Performance Computer Vision & Deep Learning Framework in C++ & CUDA with PyTorch Parity"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Onur", email = "captainonur86@gmail.com" }
]
keywords = ["deep-learning", "computer-vision", "cuda", "autograd", "cnn", "resnet", "mobilenet", "cpp"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "numpy>=1.20.0"
]

[project.optional-dependencies]
# Gerçek ONNX dışa aktarımı (nv.export_onnx) ve onnxruntime ile doğrulama
onnx = ["onnx>=1.14", "onnxruntime>=1.16"]

[project.urls]
Homepage = "https://github.com/onur/newton-vision"
Documentation = "https://github.com/onur/newton-vision/tree/master/docs"
Repository = "https://github.com/onur/newton-vision.git"

[tool.scikit-build]
cmake.version = ">=3.17"
build-dir = "build/{wheel_tag}"
