name: newton-vision Cross-Platform CI & cibuildwheel Build Pipeline

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master, main ]

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install cibuildwheel and build dependencies
        run: python -m pip install cibuildwheel build

      - name: Build wheels via cibuildwheel
        run: python -m cibuildwheel --output-dir wheelhouse
        env:
          CIBW_ARCHS_MACOS: "x86_64 arm64"
          CIBW_ARCHS_LINUX: "x86_64"
          # 32-bit Windows desteklenmiyor (AVX2/GEMM yolu ve PyPI wheel'i yalnızca 64-bit)
          CIBW_ARCHS_WINDOWS: "AMD64"
          # Her wheel kurulup C++ çekirdeği (Conv2d forward) gerçekten çalıştırılır
          CIBW_TEST_COMMAND: >-
            python -c "import numpy as np, newton_vision as nv;
            y = nv.Conv2d(1, 2, 3)(nv.Tensor(np.ones((1, 1, 8, 8), 'float32')));
            assert y.shape == (1, 2, 6, 6), y.shape; print(nv.__version__, y.shape)"

      - uses: actions/upload-artifact@v4
        with:
          name: cibuildwheel-wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl
